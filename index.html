<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FullScreen request test</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
      }

      #fullscreen-frame {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;

        background-color: white;
      }
    </style>

    <script>
      const main = () => {
        const frame = document.getElementById('fullscreen-frame')
        if (frame == null) {
          return
        }

        const button = document.getElementById('button')
        if (button == null) {
          return
        }

        button.addEventListener('click', async () => {
          if (document.fullscreenElement != null) {
            document.exitFullscreen()
            return
          }

          await frame.requestFullscreen().catch((error) => {
            alert(`このブラウザはフルスクリーンに対応していません: ${error}`)
          })
        })
      }
    </script>
  </head>
  <body>
    <div id="fullscreen-frame">
      <div class="container">
        <p>FullScreen</p>
        <button id="button">Click!</button>
      </div>
    </div>
    <script>
      main()
    </script>
  </body>
</html>
