<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FullScreen request test</title>

    <style>
      body {
        margin: 0;
        padding: 32px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7fb;
        color: #1f2937;
      }

      #fullscreen-frame {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 240px;

        background-color: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
      }

      .upload-card {
        max-width: 720px;
        margin: 24px auto 0;
        padding: 24px;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        box-shadow: 0 4px 12px rgb(15 23 42 / 8%);
      }

      .upload-card h2 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }

      .upload-card p {
        margin: 0 0 16px;
        color: #4b5563;
      }

      .accept-options {
        margin: 0 0 16px;
        padding: 12px 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
      }

      .accept-options label + label {
        margin-left: 16px;
      }

      #hex-output {
        min-height: 120px;
        max-height: 360px;
        margin: 16px 0 0;
        padding: 16px;
        overflow: auto;
        box-sizing: border-box;
        white-space: pre-wrap;
        word-break: break-all;
        font: 0.875rem/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #d1fae5;
        background: #111827;
        border-radius: 8px;
      }
    </style>

    <script>
      const main = () => {
        const frame = document.getElementById('fullscreen-frame')
        if (frame == null) {
          return
        }

        const button = document.getElementById('button')
        if (button == null) {
          return
        }

        button.addEventListener('click', async () => {
          if (document.fullscreenElement != null) {
            document.exitFullscreen()
            return
          }

          await frame.requestFullscreen().catch((error) => {
            alert(`このブラウザはフルスクリーンに対応していません: ${error}`)
          })
        })

        const fileInput = document.getElementById('file-input')
        const hexOutput = document.getElementById('hex-output')
        if (fileInput == null || hexOutput == null) {
          return
        }

        document.querySelectorAll('input[name="accept-type"]').forEach((option) => {
          option.addEventListener('change', () => {
            fileInput.accept = option.value
          })
        })

        fileInput.addEventListener('change', async () => {
          const [file] = fileInput.files
          if (file == null) {
            hexOutput.textContent = 'ファイルを選択してください。'
            return
          }

          try {
            const bytes = new Uint8Array(await file.arrayBuffer())
            const rows = []

            for (let offset = 0; offset < bytes.length; offset += 16) {
              const rowBytes = bytes.slice(offset, offset + 16)
              const hex = Array.from(rowBytes, (byte) =>
                byte.toString(16).padStart(2, '0'),
              )
                .join(' ')
                .padEnd(16 * 3 - 1, ' ')
              const ascii = Array.from(rowBytes, (byte) =>
                byte >= 0x20 && byte <= 0x7e ? String.fromCharCode(byte) : '.',
              ).join('')
              rows.push(`${offset.toString(16).padStart(8, '0')}  ${hex}    ${ascii}`)
            }

            hexOutput.textContent = rows.join('\n') || '(空のファイルです)'
          } catch (error) {
            hexOutput.textContent = `ファイルを読み込めませんでした: ${error.message}`
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="fullscreen-frame">
      <div class="container">
        <p>FullScreen</p>
        <button id="button">Click!</button>
      </div>
    </div>
    <section class="upload-card" aria-labelledby="upload-title">
      <h2 id="upload-title">ファイルをHex表示</h2>
      <p>ファイルを選択すると、内容を16バイトごとに16進数で表示します。</p>
      <fieldset class="accept-options">
        <legend>選択できるファイル形式</legend>
        <label><input type="radio" name="accept-type" value="" checked /> 指定なし</label>
        <label><input type="radio" name="accept-type" value="image/jpeg,image/png" /> JPEG・PNG画像のみ</label>
      </fieldset>
      <label for="file-input">ファイルを選択</label>
      <input id="file-input" type="file" />
      <pre id="hex-output" aria-live="polite">ファイルを選択してください。</pre>
    </section>
    <script>
      main()
    </script>
  </body>
</html>
